<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2000"
  height="2550"
  viewBox="0 0 800 1020"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">From a code point to a pair</title>
  <desc id="desc">
    Subtract hexadecimal 10000, split the 20-bit offset into high and low ten
    bits, and add D800 and DC00 respectively. U+10000 becomes D800 DC00;
    U+10FFFF becomes DBFF DFFF.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M1 1L9 5L1 9" fill="none" stroke="#a6c991" stroke-width="1.5" />
    </marker>
    <marker
      id="gray-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M1 1L9 5L1 9" fill="none" stroke="#a6b19f" stroke-width="1.5" />
    </marker>
    <pattern id="padding" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8L8 0" stroke="#344136" stroke-width="2" />
    </pattern>
  </defs>
  <style>
    text{font-family:Inter,Arial,sans-serif;font-size:24px;fill:#e5eadf}.title{font-size:32px;font-weight:600;letter-spacing:-.5px}.section{font-size:26px;font-weight:600}.small{font-size:21px}.tiny{font-size:19px}.muted{fill:#a6b19f}.green{fill:#a6c991}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:23px}.bold{font-weight:600}.light{fill:#151c17}
  </style>
  <rect width="800" height="1020" fill="#151c17" />
  <!-- prettier-ignore -->
  <text x="40" y="61" class="title" text-anchor="start" xml:space="preserve">From a code point to a pair</text>
  <!-- prettier-ignore -->
  <text x="40" y="107" class="small muted" text-anchor="start" xml:space="preserve">UTF-16 · lowest and highest supplementary code points</text>
  <rect
    x="40"
    y="140"
    width="720"
    height="349"
    rx="10"
    fill="#1d261f"
    stroke="#344136"
    stroke-width="2"
  />
  <rect
    x="62"
    y="160"
    width="170"
    height="42"
    rx="21"
    fill="#222f24"
    stroke="none"
    stroke-width="2"
  />
  <!-- prettier-ignore -->
  <text x="147" y="188" class="small green" text-anchor="middle" xml:space="preserve">U+10000</text>
  <!-- prettier-ignore -->
  <text x="62" y="241" class="mono" text-anchor="start" xml:space="preserve">0x10000 − 0x10000 = 0x00000</text>
  <!-- prettier-ignore -->
  <text x="62" y="287" class="small muted" text-anchor="start" xml:space="preserve">20-bit offset, split into two 10-bit values</text>
  <rect
    x="62"
    y="305"
    width="326"
    height="45"
    rx="4"
    fill="#222f24"
    stroke="none"
    stroke-width="2"
