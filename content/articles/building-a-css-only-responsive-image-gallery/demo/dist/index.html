<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Into the wild — a CSS-only responsive gallery</title>
    <link rel="stylesheet" href="/demo/theme.css" />
    <style>.demo-shell {
  max-width: 1200px;
}
.gallery-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.gallery-heading h1 {
  margin-bottom: 4px;
  font-size: clamp(36px, 6vw, 64px);
}
.gallery-heading p {
  color: var(--demo-muted);
  margin: 0;
}
.gallery-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
.gallery-controls select {
  font: inherit;
  color: var(--demo-ink);
  background: var(--demo-paper);
  border: 1px solid var(--demo-line);
  padding: 8px 12px;
  border-radius: 6px;
}
select:focus-visible {
  outline: 2px solid var(--demo-moss);
  outline-offset: 3px;
}
.gallery {
  display: flex;
  flex-wrap: wrap;
  margin: -6px 0 0 -6px;
}
.gallery-item {
  position: relative;
  flex: calc(var(--ratio) * 100) 1 0px;
  min-width: 0;
  aspect-ratio: var(--ratio);
  margin: 6px 0 0 6px;
  overflow: hidden;
  border-radius: 6px;
}
.gallery-item img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.gallery-break {
  display: none;
  flex: 0 0 100%;
  height: 0;
}
.gallery-item[data-position='5'],
.gallery-item[data-position='6'],
.gallery-item[data-position='7'],
.gallery-item[data-position='8'] {
  display: none;
}
.break-4 {
  display: block;
}
.gallery-more {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  background: #17291d88;
  color: white;
  font-size: clamp(24px, 5vw, 48px);
  font-weight: 600;
  text-shadow: 0 1px 8px #0008;
}
.more-4 {
  display: flex;
}
.gallery-footer {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  border-top: 1px solid var(--demo-line);
  margin-top: 24px;
  padding-top: 16px;
  color: var(--demo-muted);
  font-size: 13px;
  line-height: 1.6;
}
.gallery-footer a {
  color: inherit;
}
.capacity::after {
  content: 'Up to 4 images · 2 per row';
}
@media (min-width: 640px) {
  .gallery-item[data-position='5'],
  .gallery-item[data-position='6'] {
    display: block;
  }
  .break-4,
  .more-4 {
    display: none;
  }
  .break-6 {
    display: block;
  }
  .more-6 {
    display: flex;
  }
  .capacity::after {
    content: 'Up to 6 images · 3 per row';
  }
}
@media (min-width: 1024px) {
  .gallery-item[data-position='7'],
  .gallery-item[data-position='8'] {
    display: block;
  }
  .break-6,
  .more-6 {
    display: none;
  }
  .break-8 {
    display: block;
  }
  .more-8 {
    display: flex;
  }
  .capacity::after {
    content: 'Up to 8 images · 4 per row';
  }
}
</style>
  <script src="/demo/frame.js"></script></head>
