    stroke-linejoin="round"
    marker-end="url(#scaling-arrow)"
  />
  <path
    d="M510 287Q560 256 610 287"
    fill="none"
    stroke="var(--color-moss, #3a643f)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    marker-end="url(#scaling-arrow)"
  />
  <!-- prettier-ignore -->
  <text x="560" y="225" class="small green" text-anchor="middle" xml:space="preserve">Network communication</text>
  <!-- prettier-ignore -->
  <text x="40" y="435" class="small muted" text-anchor="start" xml:space="preserve">Add capacity to one machine.</text>
  <!-- prettier-ignore -->
  <text x="370" y="435" class="small muted" text-anchor="start" xml:space="preserve">Spread work across machines.</text>
</svg>
