  />
  <path d="M392 316h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path d="M392 330h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path d="M392 344h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <rect
    x="480"
    y="300"
    width="65"
    height="65"
    rx="8"
    fill="var(--color-leaf, #e9efdf)"
    stroke="var(--color-moss, #3a643f)"
    stroke-width="2"
  />
  <path d="M492 316h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path d="M492 330h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path d="M492 344h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <rect
    x="580"
    y="300"
    width="65"
    height="65"
    rx="8"
    fill="var(--color-leaf, #e9efdf)"
    stroke="var(--color-moss, #3a643f)"
    stroke-width="2"
  />
  <path d="M592 316h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path d="M592 330h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path d="M592 344h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <rect
    x="680"
    y="300"
    width="65"
    height="65"
    rx="8"
    fill="var(--color-leaf, #e9efdf)"
    stroke="var(--color-moss, #3a643f)"
    stroke-width="2"
  />
  <path d="M692 316h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path d="M692 330h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path d="M692 344h41" stroke="var(--color-moss, #3a643f)" stroke-width="2" />
  <path
