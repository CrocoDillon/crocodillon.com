  <path d="M40 88H760" stroke="var(--color-line, #dce1d6)" stroke-width="2" />
  <!-- prettier-ignore -->
  <text x="40" y="137" class="section" text-anchor="start" xml:space="preserve">Vertical</text>
  <!-- prettier-ignore -->
  <text x="40" y="171" class="small muted" text-anchor="start" xml:space="preserve">A bigger server</text>
  <rect
