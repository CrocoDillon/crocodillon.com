<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="760"
  viewBox="0 0 800 760"
  class="article-diagram"
  role="img"
  aria-labelledby="joins-and-nesting-title joins-and-nesting-desc"
>
  <title id="joins-and-nesting-title">Joins or nested documents</title>
  <desc id="joins-and-nesting-desc">
    Two relational tables join on p to produce the same fields held together in
    a MongoDB document: id Q33, x 3, y abc and z array containing 1 and 2.
  </desc>
  <defs>
    <marker
      id="joins-and-nesting-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path
        d="M1 1L9 5L1 9"
        fill="none"
        stroke="var(--color-moss, #3a643f)"
        stroke-width="1.5"
      />
    </marker>
    <marker
      id="joins-and-nesting-gray-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path
        d="M1 1L9 5L1 9"
        fill="none"
        stroke="var(--color-muted, #677061)"
        stroke-width="1.5"
      />
    </marker>
    <pattern
      id="joins-and-nesting-padding"
      width="8"
      height="8"
      patternUnits="userSpaceOnUse"
    >
      <path d="M0 8L8 0" stroke="var(--color-line, #dce1d6)" stroke-width="2" />
    </pattern>
  </defs>
  <style>
    svg.article-diagram text{font-family:Inter,Arial,sans-serif;font-size:24px;fill:var(--color-ink, #20291e)}svg.article-diagram .title{font-size:32px;font-weight:600;letter-spacing:-.5px}svg.article-diagram .section{font-size:26px;font-weight:600}svg.article-diagram .small{font-size:21px}svg.article-diagram .tiny{font-size:19px}svg.article-diagram .muted{fill:var(--color-muted, #677061)}svg.article-diagram .green{fill:var(--color-moss, #3a643f)}svg.article-diagram .mono{font-family:Consolas,'Liberation Mono',monospace;font-size:23px}svg.article-diagram .bold{font-weight:600}svg.article-diagram .light{fill:var(--color-paper, #f8f9f5)}
          @media (prefers-color-scheme: dark) {
            :root.article-diagram {
              --color-paper: #151c17; --color-ink: #e5eadf; --color-moss: #a6c991;
              --color-muted: #a6b19f; --color-leaf: #222f24; --color-line: #344136;
              --color-diagram-panel: #1d261f;
            }
          }
  </style>
  <rect width="800" height="760" fill="var(--color-paper, #f8f9f5)" />
  <!-- prettier-ignore -->
  <text x="40" y="61" class="title" text-anchor="start" xml:space="preserve">Joins or nested documents</text>
  <path d="M40 90H760" stroke="var(--color-line, #dce1d6)" stroke-width="2" />
  <!-- prettier-ignore -->
  <text x="40" y="139" class="section" text-anchor="start" xml:space="preserve">Relational database</text>
  <!-- prettier-ignore -->
  <text x="430" y="139" class="section" text-anchor="start" xml:space="preserve">MongoDB</text>
  <path d="M400 118V700" stroke="var(--color-line, #dce1d6)" stroke-width="2" />
  <!-- prettier-ignore -->
  <text x="40" y="190" class="small muted" text-anchor="start" xml:space="preserve">Table t</text>
  <!-- prettier-ignore -->
  <text x="267" y="190" class="small muted" text-anchor="start" xml:space="preserve">Table tz</text>
  <rect
    x="40"
    y="210"
    width="200"
    height="92"
    rx="6"
    fill="var(--color-diagram-panel, #ffffff)"
    stroke="var(--color-line, #dce1d6)"
    stroke-width="2"
  />
  <rect
    x="40"
    y="210"
    width="200"
    height="46"
    rx="6"
    fill="var(--color-leaf, #e9efdf)"
    stroke="none"
    stroke-width="2"
  />
  <!-- prettier-ignore -->
  <text x="73.33333333333334" y="240" class="mono bold" text-anchor="middle" xml:space="preserve">p</text>
  <!-- prettier-ignore -->
  <text x="140" y="240" class="mono bold" text-anchor="middle" xml:space="preserve">x</text>
  <!-- prettier-ignore -->
  <text x="206.66666666666669" y="240" class="mono bold" text-anchor="middle" xml:space="preserve">y</text>
  <!-- prettier-ignore -->
  <text x="73.33333333333334" y="286" class="mono small" text-anchor="middle" xml:space="preserve">Q33</text>
  <!-- prettier-ignore -->
  <text x="140" y="286" class="mono small" text-anchor="middle" xml:space="preserve">3</text>
  <!-- prettier-ignore -->
  <text x="206.66666666666669" y="286" class="mono small" text-anchor="middle" xml:space="preserve">abc</text>
  <rect
    x="260"
    y="210"
    width="110"
    height="138"
    rx="6"
    fill="var(--color-diagram-panel, #ffffff)"
    stroke="var(--color-line, #dce1d6)"
    stroke-width="2"
  />
  <rect
    x="260"
    y="210"
    width="110"
    height="46"
    rx="6"
    fill="var(--color-leaf, #e9efdf)"
    stroke="none"
    stroke-width="2"
  />
  <!-- prettier-ignore -->
  <text x="287.5" y="240" class="mono bold" text-anchor="middle" xml:space="preserve">p</text>
  <!-- prettier-ignore -->
  <text x="342.5" y="240" class="mono bold" text-anchor="middle" xml:space="preserve">z</text>
  <!-- prettier-ignore -->
  <text x="287.5" y="286" class="mono small" text-anchor="middle" xml:space="preserve">Q33</text>
  <!-- prettier-ignore -->
  <text x="342.5" y="286" class="mono small" text-anchor="middle" xml:space="preserve">1</text>
  <!-- prettier-ignore -->
  <text x="287.5" y="332" class="mono small" text-anchor="middle" xml:space="preserve">Q33</text>
  <!-- prettier-ignore -->
  <text x="342.5" y="332" class="mono small" text-anchor="middle" xml:space="preserve">2</text>
  <!-- prettier-ignore -->
  <text x="430" y="190" class="small muted" text-anchor="start" xml:space="preserve">One document</text>
  <rect
    x="430"
    y="210"
    width="330"
    height="294"
    rx="10"
    fill="var(--color-diagram-panel, #ffffff)"
    stroke="var(--color-line, #dce1d6)"
    stroke-width="2"
  />
  <!-- prettier-ignore -->
  <text x="450" y="251" class="mono" text-anchor="start" xml:space="preserve">{</text>
  <!-- prettier-ignore -->
  <text x="450" y="292" class="mono" text-anchor="start" xml:space="preserve">  &quot;_id&quot;: &quot;Q33&quot;,</text>
  <!-- prettier-ignore -->
  <text x="450" y="333" class="mono" text-anchor="start" xml:space="preserve">  &quot;x&quot;: 3,</text>
  <!-- prettier-ignore -->
  <text x="450" y="374" class="mono" text-anchor="start" xml:space="preserve">  &quot;y&quot;: &quot;abc&quot;,</text>
  <!-- prettier-ignore -->
  <text x="450" y="415" class="mono" text-anchor="start" xml:space="preserve">  &quot;z&quot;: [1, 2]</text>
  <!-- prettier-ignore -->
  <text x="450" y="456" class="mono" text-anchor="start" xml:space="preserve">}</text>
  <!-- prettier-ignore -->
  <text x="40" y="430" class="small muted" text-anchor="start" xml:space="preserve">Join the matching rows</text>
  <rect
    x="40"
    y="450"
    width="330"
    height="237"
    rx="10"
    fill="var(--color-diagram-panel, #ffffff)"
    stroke="var(--color-line, #dce1d6)"
    stroke-width="2"
  />
  <!-- prettier-ignore -->
  <text x="58" y="494" class="mono small" text-anchor="start" xml:space="preserve">SELECT *</text>
  <!-- prettier-ignore -->
  <text x="58" y="537" class="mono small" text-anchor="start" xml:space="preserve">FROM t, tz</text>
  <!-- prettier-ignore -->
  <text x="58" y="580" class="mono small" text-anchor="start" xml:space="preserve">WHERE t.p = tz.p</text>
  <!-- prettier-ignore -->
  <text x="58" y="623" class="mono small" text-anchor="start" xml:space="preserve">  AND t.p = 'Q33'</text>
  <!-- prettier-ignore -->
  <text x="430" y="551" class="small muted" text-anchor="start" xml:space="preserve">Query the document</text>
  <rect
    x="430"
    y="571"
    width="330"
    height="116"
    rx="10"
    fill="var(--color-leaf, #e9efdf)"
    stroke="none"
    stroke-width="2"
  />
  <!-- prettier-ignore -->
  <text x="448" y="603" class="mono small" text-anchor="start" xml:space="preserve">db.parts.find({</text>
  <!-- prettier-ignore -->
  <text x="448" y="635" class="mono small" text-anchor="start" xml:space="preserve">  &quot;_id&quot;: &quot;Q33&quot;</text>
  <!-- prettier-ignore -->
  <text x="448" y="667" class="mono small" text-anchor="start" xml:space="preserve">})</text>
</svg>
