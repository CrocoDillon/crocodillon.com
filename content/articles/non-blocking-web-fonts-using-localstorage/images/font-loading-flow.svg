    >
      <path d="M1 1L9 5L1 9" fill="none" stroke="#3a643f" stroke-width="1.5" />
    </marker>
    <marker
      id="gray-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M1 1L9 5L1 9" fill="none" stroke="#677061" stroke-width="1.5" />
    </marker>
    <pattern id="padding" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8L8 0" stroke="#dce1d6" stroke-width="2" />
    </pattern>
  </defs>
