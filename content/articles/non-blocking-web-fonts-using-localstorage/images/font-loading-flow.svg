  <title id="title">Load fonts without blocking</title>
  <desc id="desc">
    Redrawn from the Guardian font-loading flow in the 2014 article. Before
    rendering, a capable browser with WOFF support uses stored fonts if
    available. Otherwise no web fonts are shown yet. After rendering, available
    storage enables download, caching, and display of the fonts.
  </desc>
